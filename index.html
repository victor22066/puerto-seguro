<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Lugar Seguro</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:92%;max-width:420px;background:rgba(255,255,255,.08);padding:20px;border-radius:18px}
h1{text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}
.tabs button{flex:1;padding:10px;border:none;border-radius:8px;background:#334155;color:#fff;cursor:pointer}
.tab{display:none}
.tab.active{display:block}
.action{display:block;text-align:center;text-decoration:none;background:#38bdf8;color:#fff;padding:12px;border-radius:999px;margin-top:12px}
iframe{width:100%;height:152px;border:none;border-radius:12px}
#breath{font-size:22px;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1 id="titulo"></h1>
<p style="text-align:center">Esse cantinho foi feito para você respirar, descansar e lembrar que você não está sozinha. 🤍</p>

<div class="tabs">
<button onclick="openTab('resp')">Respirar</button>
<button onclick="openTab('musica')">Música</button>
<button onclick="openTab('desenho')">Desenhar</button>
<button onclick="openTab('vers')">Versículos</button>
<button onclick="openTab('contato')">Falar comigo</button>
</div>

<div id="resp" class="tab active">
<p>Respire no ritmo abaixo:</p>
<div id="breath">Inspire 🌿</div>
</div>

<div id="musica" class="tab">
<iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DWYBXtbGSCurj" allow="autoplay; clipboard-write; encrypted-media"></iframe>
</div>

<div id="desenho" class="tab">
<p>Vamos desenhar juntos.</p>
<a class="action" href="https://aggie.io/" target="_blank">Abrir Aggie.io</a>
</div>

<div id="vers" class="tab">
<p id="versiculo"></p>
<a href="#" class="action" onclick="novoVersiculo();return false;">Outro versículo</a>
</div>

<div id="contato" class="tab">
<p>Se precisar conversar, estou aqui.</p>
<a class="action" href="https://wa.me/qr/RBBDJ6ICSCTTH1" target="_blank">WhatsApp</a>
</div>

</div>

<script>
function openTab(id){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

const apelidos=["Mariana","Missionária","Dorameira"];
document.getElementById("titulo").textContent="Bem-vinda, "+apelidos[Math.floor(Math.random()*apelidos.length)]+"!";

const versos=[
"\"Lancem sobre Ele toda a sua ansiedade, porque Ele tem cuidado de vocês.\" — 1 Pedro 5:7",
"\"Não andem ansiosos por coisa alguma.\" — Filipenses 4:6",
"\"Vinde a mim todos os que estão cansados.\" — Mateus 11:28",
"\"Deixo-vos a minha paz.\" — João 14:27",
"\"O Senhor é o meu pastor; nada me faltará.\" — Salmo 23:1",
"\"Espera no Senhor; anima-te.\" — Salmo 27:14"
];
function novoVersiculo(){
document.getElementById("versiculo").textContent=versos[Math.floor(Math.random()*versos.length)];
}
novoVersiculo();

const passos=["Inspire 🌿","Segure 🤍","Expire 🍃"];
let i=0;
setInterval(()=>{document.getElementById("breath").textContent=passos[i%3];i++;},4000);
</script>
</body>
</html>
